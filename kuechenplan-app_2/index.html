<style>
/* Layout: schmale Handy-Spalte, Marineblau-Kopf mit Schraffur-Kreis, Karten auf hellem Grund, feste Tab-Leiste unten.
   Farbe: Marine, Terrakotta, Senf, warmes Offwhite (nach der Pflanzenkarte der Nutzerin).
   Schrift: Young Serif für Überschriften, Figtree für Text. */
:root {
  --bg: #f6f2ea;
  --surface: #fffdf8;
  --surface-2: #efe9dc;
  --fg: #1b2d4a;
  --muted: #5d6b82;
  --line: #ded6c6;
  --navy: #223a5e;
  --navy-fg: #f6f2ea;
  --accent: #b85a24;
  --accent-fg: #ffffff;
  --mustard: #d9a441;
  --good: #3f7d4f;
  --bad: #a8433a;
  --shadow: 0 1px 2px rgba(27,45,74,.08), 0 4px 14px rgba(27,45,74,.06);
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13203a; --surface: #1c2d4d; --surface-2: #243759; --fg: #f1ece2; --muted: #a9b4c8;
    --line: #2f4468; --navy: #0e1830; --navy-fg: #f1ece2; --accent: #e0803f; --accent-fg: #1a1208;
    --mustard: #e2b25a; --good: #7fc08f; --bad: #e08a80; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13203a; --surface: #1c2d4d; --surface-2: #243759; --fg: #f1ece2; --muted: #a9b4c8;
  --line: #2f4468; --navy: #0e1830; --navy-fg: #f1ece2; --accent: #e0803f; --accent-fg: #1a1208;
  --mustard: #e2b25a; --good: #7fc08f; --bad: #e08a80; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  min-height: 100%; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
.app { max-width: 560px; margin: 0 auto; padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
.top {
  position: relative; overflow: hidden; background: var(--navy); color: var(--navy-fg);
  padding: 20px 16px 22px; border-radius: 0 0 28px 28px;
}
.top::after {
  content: ""; position: absolute; right: -46px; top: -46px; width: 150px; height: 150px; border-radius: 50%;
  background: repeating-linear-gradient(135deg, var(--mustard) 0 3px, transparent 3px 8px); opacity: .85; pointer-events: none;
}
.top::before {
  content: ""; position: absolute; left: -30px; bottom: -34px; width: 96px; height: 96px; border-radius: 50%;
  background: var(--accent); opacity: .95; pointer-events: none;
}
.top > * { position: relative; z-index: 1; }
.brand { font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; margin: 0 0 4px; }
.sub { margin: 0; font-size: .9rem; opacity: .85; max-width: 26ch; }
.who { display: inline-flex; margin-top: 14px; background: rgba(255,255,255,.12); border-radius: 999px; padding: 3px; gap: 2px; }
.who button { border: 0; background: transparent; color: inherit; padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600; }
.who button[aria-pressed="true"] { background: var(--navy-fg); color: var(--navy); }
main { padding: 20px 16px 0; display: flex; flex-direction: column; gap: 16px; }
.h-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.h-row h2 { font-size: 1.35rem; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
.card.big { padding: 18px; }
.day { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.dish { font-family: var(--font-display); font-size: 1.3rem; line-height: 1.2; margin: 0; text-align: left; background: none; border: 0; padding: 0; }
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg); }
.chip.hot { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.chip.cook { background: var(--navy); color: var(--navy-fg); }
.chip.sun { background: color-mix(in srgb, var(--mustard) 40%, var(--surface)); }
.btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 600; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.small { padding: 7px 12px; font-size: .85rem; }
.btn:focus-visible, .tab:focus-visible, .who button:focus-visible, .dish:focus-visible, .heart:focus-visible, .check:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.heart { border: 0; background: var(--surface-2); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.heart svg { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 2; }
.heart[aria-pressed="true"] svg { fill: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.empty { text-align: center; padding: 28px 16px; }
.empty h3 { font-size: 1.25rem; margin-bottom: 6px; }
.stores { display: flex; flex-direction: column; gap: 16px; }
.store-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.store-h h3 { font-size: 1.15rem; }
.store-h span { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.check { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; border: 2px solid var(--muted); border-radius: 8px; flex: none; margin: 0; display: grid; place-items: center; background: transparent; cursor: pointer; }
.check:checked { background: var(--good); border-color: var(--good); }
.check:checked::after { content: ""; width: 7px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.item .name { overflow-wrap: anywhere; }
.nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.rt { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.pr { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 999px; padding: 4px 10px; font-size: .74rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.pchip.none { color: var(--muted); border-style: dashed; background: transparent; }
.pchip.best { background: color-mix(in srgb, var(--good) 22%, var(--surface)); border-color: var(--good); }
.pchip:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
.src { margin: 0; font-size: .74rem; color: var(--muted); }
.item .qty { color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.item.done .name { text-decoration: line-through; color: var(--muted); }
.item .have { border: 0; background: none; color: var(--muted); font-size: .78rem; text-decoration: underline; padding: 4px; }
.banner { background: color-mix(in srgb, var(--mustard) 28%, var(--surface)); border-radius: 14px; padding: 12px 14px; font-size: .88rem; }
.stage { position: relative; height: 380px; max-width: 100%; touch-action: pan-y; }
.swipe {
  position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 22px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.swipe h3 { font-size: 1.6rem; line-height: 1.15; }
.swipe .meta { color: var(--muted); font-size: .92rem; margin: 10px 0 0; }
.swipe .stamp { position: absolute; top: 18px; right: 18px; font-weight: 700; letter-spacing: .06em; font-size: .85rem; padding: 5px 10px; border-radius: 8px; border: 2px solid; opacity: 0; }
.stamp.yes { color: var(--good); } .stamp.no { color: var(--bad); left: 18px; right: auto; }
.under { position: absolute; inset: 14px 10px -10px; background: var(--surface-2); border-radius: 22px; z-index: 0; }
.swipe { z-index: 1; }
.vote { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.vote .btn { padding: 13px 10px; }
.vote .heart { width: 56px; height: 56px; }
.vote .heart svg { width: 28px; height: 28px; }
.sheet-bg { position: fixed; inset: 0; background: rgba(10,20,40,.55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 88%; overflow: auto; border-radius: 24px 24px 0 0; padding: 22px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-size: 1.5rem; margin-bottom: 6px; }
.sheet h4 { margin: 18px 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sheet ul, .sheet ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center;
}
.tabs-in { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100%; max-width: 560px; }
.tab { border: 0; background: none; border-radius: 14px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--muted); position: relative; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--fg); background: var(--surface-2); }
.tab[aria-current="page"] svg { stroke: var(--accent); }
.badge { position: absolute; top: 2px; right: calc(50% - 22px); background: var(--accent); color: var(--accent-fg); min-width: 18px; height: 18px; border-radius: 9px; font-size: .68rem; display: grid; place-items: center; padding: 0 5px; }
select { font: inherit; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.pool { font-variant-numeric: tabular-nums; }
.offer { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.offer:first-of-type { border-top: 0; }
.offer .on { min-width: 0; overflow-wrap: anywhere; }
.offer .op { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.offer .meta { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }
@media (prefers-reduced-motion: reduce) { .swipe { transition: none !important; } }
.dishimg { display:block; width:100%; height:140px; object-fit:cover; border-radius:12px; margin:0 0 10px; background:var(--surface); }
.dishimg.big { height:200px; }
.dishimg.illu { background:#f1e6cf; height:130px; }
.dishimg.illu.big { height:190px; }
.ph { display:flex; align-items:center; justify-content:center; width:100%; height:120px; border-radius:12px; margin:0 0 10px; background:var(--surface); color:var(--line); border:1.5px dashed var(--line); }
.ph svg { width:44px; height:44px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
</style>

function saveBon(){

    items.push(row);
    if (row.ing && CATALOG[row.ing] && q > 0 && pr > 0 && STORES.indexOf(store) >= 0) {
      var u = CATALOG[row.ing].u, per = unitPrice(u, pr, q);
      var cmp = compareLine(row.ing, store, per, q, S.prices);

      if (!S.prices[row.ing]) S.prices[row.ing] = {};

  var rec = {id:"b" + Date.now(), store:store, date:date, total:tt, items:items, sav:{gain:round2(gain), lost:round2(lost), n:cmpN}};
  S.receipts[rec.id] = rec;

}

function dateLabelIso(d){ var a = String(d).split("-"); return a.length === 3 ? a[2] + "." + a[1] + "." : String(d); }
function scanFile(file){
  scanMsg = ""; scanBusy = true; render();
  var done = function(msg){ scanBusy = false; if (msg) scanMsg = msg; render(); };
  (async function(){
    var sample = await claude.use("sample");
    if (!sample) return done("Das Foto-Lesen geht hier nicht. Du kannst den Bon von Hand eintragen.");
    var lim = null; try { lim = await sample.limits(); } catch(_){}
    if (lim && !lim.images) return done("Das Foto-Lesen ist in dieser Ansicht nicht freigeschaltet. Du kannst den Bon von Hand eintragen.");
    var bmp = await createImageBitmap(file);
    var sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    var cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    var blob = await new Promise(function(res){ cv.toBlob(res, "image/jpeg", 0.85); });
    var prompt = "Das Bild ist ein deutscher Supermarkt-Kassenbon. Lies ihn ab und antworte NUR mit JSON in genau dieser Form: " +
      '{"store":"Aldi|Rewe|Zara Markt|Anderer Laden","date":"YYYY-MM-DD oder null","total":Zahl oder null,"items":[{"name":"Text","price":Zahl oder null}]}. ' +
      "Regeln: price ist der Betrag der Zeile in Euro als Zahl mit Punkt. Rabatte und Pfand als eigene Zeile, Rabatte negativ. Bei Menge mal Einzelpreis zählt der Zeilenbetrag, die Menge gehört in den Namen. Ist etwas nicht sicher lesbar, nimm null statt zu raten. Erfinde keine Zeilen. Hat der Bon keine Zeilen zu Zahlungsart oder Steuer, lass sie weg.";
    var data = await sample.json(prompt, {images:[blob], cache:false});
    if (!data || !Array.isArray(data.items)) return done("Ich konnte den Bon nicht lesen. Versuch ein schärferes Foto bei gutem Licht, flach und ganz im Bild.");
    var st = STORES.concat(["Anderer Laden"]).indexOf(data.store) >= 0 ? data.store : "Anderer Laden";
    var dt = /^\d{4}-\d{2}-\d{2}$/.test(String(data.date)) ? data.date : iso(new Date());
    draft = {store:st, date:dt, total: typeof data.total === "number" ? String(data.total).replace(".", ",") : "",
      items:data.items.slice(0, 80).map(function(x){
        var nm = String(x.name || "").slice(0, 80), L = S.learn[learnKey(nm)];
        var ok = L && CATALOG[L.ing];
        return {n:nm, p: typeof x.price === "number" ? String(x.price).replace(".", ",") : "", ing: ok ? L.ing : "", q: ok ? String(L.pack).replace(".", ",") : ""};
      })};
    done("");
  })().catch(function(e){
    var c = e && e.code;
    done(c === "not_granted" ? "Ohne deine Erlaubnis kann ich den Bon nicht lesen. Du kannst ihn von Hand eintragen." :
         c === "rate_limited" ? "Gerade zu viele Anfragen. Bitte in einer Minute noch einmal." :
         "Das Lesen hat nicht geklappt. Versuch es noch einmal oder trag den Bon von Hand ein.");
  });
}

function bindSwipe(){
  var card = document.getElementById("card"); if (!card) return;
  var x0 = null, dx = 0, id = card.getAttribute("data-id");
  var yes = document.getElementById("stYes"), no = document.getElementById("stNo");
  function paint(){
    card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 18) + "deg)";
    yes.style.opacity = dx > 0 ? Math.min(1, dx / 90) : 0; no.style.opacity = dx < 0 ? Math.min(1, -dx / 90) : 0;
  }
  card.addEventListener("pointerdown", function(e){ x0 = e.clientX; dx = 0; card.style.transition = "none"; try { card.setPointerCapture(e.pointerId); } catch(_){} });
  card.addEventListener("pointermove", function(e){ if (x0 === null) return; dx = e.clientX - x0; paint(); });
  function end(){
    if (x0 === null) return; x0 = null; card.style.transition = "transform .2s";
    if (dx > 90) vote(id, "like"); else if (dx < -90) vote(id, "dislike"); else { dx = 0; paint(); }
  }
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}
